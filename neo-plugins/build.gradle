plugins {
    id 'java'
}

group = 'com.github.karmadeb'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    subprojects {
        dependencies {
            implementation(project(':neo-api'))
            implementation(project(':neo-api-bridge'))
            implementation(project(':neo-common'))
            implementation(project(':neo-essentials:auth'))
            implementation(project(':neo-essentials:crypto'))
            implementation(project(':neo-essentials:jooq'))
        }
    }
}

test {
    useJUnitPlatform()
}