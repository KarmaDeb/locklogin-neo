plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'com.github.karmadeb.neo-plugins'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //noinspection VulnerableLibrariesLocal
    compileOnly('org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT')

    implementation(project(':neo-bases:bukkit'))
}

test {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('shadowJar') {
    archiveBaseName.set('locklogin-neo')
    archiveClassifier.set('spigot')
    archiveVersion.set(project.version.toString().toLowerCase())

    dependencies {
        exclude dependency('org.jooq:.*:.*')
        exclude dependency('io.r2dbc:.*:.*')
        exclude dependency('org.reactivestreams:.*:.*')
    }
}