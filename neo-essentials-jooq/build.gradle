import nu.studer.gradle.jooq.JooqEdition

plugins {
    id 'java'
    id('nu.studer.jooq') version '10.2.1'
}

group = 'com.github.karmadeb'
version = '1.0-SNAPSHOT'
description = '''
locklogin-neo extensions jooq is part of the neo-essentials extension
set. Before we explain what jooq extension is, let's answer first what is
"neo-essentials extension set".

NEO-Essentials extension set is a set of official extensions packed with
LockLogin (extracted during plugin startup) which are required in order for
the plugin to work properly. Essentials stops loading a subset of extension
if another extension requests it. For instance;

Extension A which was installed by the server owner, already provides what
neo-extension jooq provides in another way, that extension can then explicitly
configure the essentials module to not load the JOOQ extension through
EssentialFeatures.disable(EssentialFeatures.FEATURE_JOOQ);

This is of course just an example, usually if you would want to add support for
a new dialect already supported by JOOQ, you would just include the neo-extensions-jooq
as a dependency to your project build manager, and then configure your extension
to depend on neo-essentials-jooq.

Where does neo-extension-jooq live?
All of LockLogin essential extensions live inside the LockLogin codebase, and the
plugin loading it is the own LockLogin.
'''

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("org.jooq:jooq:3.21.9")

    //noinspection VulnerableLibrariesLocal
    compileOnly('org.bukkit:bukkit:26.3-R0.1-SNAPSHOT')

    compileOnly("commons-validator:commons-validator:1.11.0")

    compileOnly("com.zaxxer:HikariCP:7.1.0")
    compileOnly("com.mysql:mysql-connector-j:26.10.0")
    compileOnly("org.mariadb.jdbc:mariadb-java-client:4.0.0")
    compileOnly("org.xerial:sqlite-jdbc:3.54.1.0")
    compileOnly("org.postgresql:postgresql:42.7.14")

    compileOnly(project(':neo-common'))

    // Special definitions
    jooqGenerator("org.postgresql:postgresql:42.7.14")
}

test {
    useJUnitPlatform()
}


jooq {
    version = '3.21.9'
    edition = JooqEdition.OSS

    configurations {
        main {
            generationTool {
                //noinspection GroovyAssignabilityCheck
                logging = org.jooq.meta.jaxb.Logging.WARN

                jdbc {
                    //noinspection GroovyAssignabilityCheck
                    driver = 'org.postgresql.Driver'
                    //noinspection GroovyAssignabilityCheck
                    url = 'jdbc:postgresql://localhost:5432/postgres'
                    //noinspection GroovyAssignabilityCheck
                    user = 'postgres'
                    //noinspection GroovyAssignabilityCheck
                    password = 'postgres'
                }

                generator {
                    //noinspection GroovyAssignabilityCheck
                    name = 'org.jooq.codegen.JavaGenerator'

                    database {
                        //noinspection GroovyAssignabilityCheck
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        //noinspection GroovyAssignabilityCheck
                        inputSchema = 'public'
                    }

                    target {
                        //noinspection GroovyAssignabilityCheck
                        packageName = 'com.github.karmadeb.locklogin.neo.common.jooq.orm'
                        //noinspection GroovyAssignabilityCheck
                        directory = 'build/generated-src/jooq/main'
                    }
                }
            }
        }
    }
}