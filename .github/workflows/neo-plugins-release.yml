name: Build and release neo-plugins

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        module:
          - neo-plugins:spigot

    steps:
      - name: Check out repository and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          project_version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.gradle.kts | head -n 1)
          if [ -z "$project_version" ]; then
            echo "Could not read the project version from build.gradle.kts" >&2
            exit 1
          fi
          echo "project_version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Initialize jOOQ schema
        env:
          PGPASSWORD: postgres
        run: psql --host=localhost --port=5432 --username=postgres --dbname=postgres --file=.github/scripts/init-jooq-schema.sql

      - name: Build module
        id: build
        env:
          MODULE_PATH: ${{ matrix.module }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew "$MODULE_PATH:build" --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Create GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_PATH: ${{ matrix.module }}
          PROJECT_VERSION: ${{ steps.metadata.outputs.project_version }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          module_name="${MODULE_PATH##*:}"
          release_version="${PROJECT_VERSION}+${SHORT_SHA}"
          tag_prefix="neo-plugins-${module_name}"
          tag="${tag_prefix}-${release_version}"
          artifact=$(find "neo-plugins/${module_name}/build/libs" -maxdepth 1 -type f -name '*.jar' -print -quit)
          if [ -z "$artifact" ]; then
            echo "No JAR artifact found for ${MODULE_PATH}" | tee -a build.log
            exit 1
          fi

          last_tag=$(git describe --tags --match "${tag_prefix}-*" --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$last_tag" ]; then
            commits=$(git log --reverse --format='- %h %s' "${last_tag}..HEAD")
          else
            commits=$(git log --reverse --format='- %h %s' HEAD)
          fi
          if [ -z "$commits" ]; then
            commits='- No commits since the previous release.'
          fi

          {
            printf 'Build artifact for `%s` at `%s`.\n\n' "$MODULE_PATH" "$SHORT_SHA"
            printf 'Commits since the previous %s release:\n\n%s\n' "$module_name" "$commits"
          } > release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping duplicate publication."
            exit 0
          fi

          gh release create "$tag" "$artifact" \
            --title "${module_name} ${release_version}" \
            --notes-file release-notes.md 2>&1 | tee -a build.log

      - name: Create issue for failed build or release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_PATH: ${{ matrix.module }}
          PROJECT_VERSION: ${{ steps.metadata.outputs.project_version }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          module_name="${MODULE_PATH##*:}"
          issue_title="Build failed: ${module_name} ${PROJECT_VERSION:-unknown}+${SHORT_SHA:-unknown}"
          {
            printf 'The build or release for `%s` failed.\n\n' "$MODULE_PATH"
            printf -- '- Commit: `%s`\n' "${SHORT_SHA:-unknown}"
            printf -- '- Project version: `%s`\n' "${PROJECT_VERSION:-unknown}"
            printf -- '- Workflow run: %s\n\n' "$RUN_URL"
            printf 'Error output (last 120 lines):\n\n```text\n'
            if [ -f build.log ]; then
              tail -n 120 build.log
            else
              printf 'No build log was produced; inspect the workflow run for the failing step.\n'
            fi
            printf '\n```\n'
          } > issue-body.md
          gh issue create --title "$issue_title" --body-file issue-body.md